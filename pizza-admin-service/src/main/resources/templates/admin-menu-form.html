<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Menu Item Form</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fafafa; margin: 0; padding: 0; }
        header { background-color: #d32f2f; color: #ffffff; padding: 15px 20px; }
        header h1 { margin: 0; font-size: 22px; }
        nav a { color: #ffffff; margin-right: 15px; text-decoration: none; font-size: 14px; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 600px; margin: 20px auto; background-color: #ffffff; padding: 20px; box-shadow: 0 0 8px rgba(0, 0, 0, 0.1); }
        h2 { margin-top: 0; }
        form label { display: block; margin-top: 10px; font-weight: bold; }
        form input[type="text"], form input[type="number"], form textarea, form select { width: 100%; padding: 8px; margin-top: 4px; font-size: 14px; box-sizing: border-box; }
        form textarea { resize: vertical; min-height: 60px; }
        .checkbox-row { margin-top: 10px; }
        .checkbox-row label { display: inline-block; font-weight: normal; }
        .buttons { margin-top: 15px; }
        .buttons button, .buttons a { display: inline-block; padding: 8px 14px; border-radius: 4px; border: none; text-decoration: none; font-size: 14px; cursor: pointer; }
        .buttons button { background-color: #388e3c; color: #ffffff; }
        .buttons button:hover { background-color: #2e7d32; }
        .buttons a { background-color: #9e9e9e; color: #ffffff; }
        .buttons a:hover { background-color: #616161; }
        footer { margin-top: 20px; padding: 10px 20px; text-align: center; font-size: 12px; color: #777777; }
    </style>
</head>
<body>
<header>
    <h1>Pizza Store - Admin Panel</h1>
    <nav>
        <a href="/admin/home">Home</a>
        <a href="/admin/menu">Menu Management</a>
        <a href="/admin/orders">Orders</a>
        <a href="/admin/logout">Logout</a>
    </nav>
</header>

<div class="container">
    <h2 th:text="${formTitle}">Menu Item</h2>

    <form th:object="${menuItem}"
          th:action="${#strings.isEmpty(menuItem.id) ? '/admin/menu' : '/admin/menu/' + menuItem.id}"
          method="post">

        <label for="category">Category</label>
        <select id="category" th:field="*{category}">
            <option value="">-- Select Category --</option>
            <option th:each="cat : ${categories}" 
                    th:value="${cat.id}" 
                    th:text="${cat.name}">Category Name</option>
        </select>

        <label for="name">Name</label>
        <input id="name" type="text" th:field="*{name}" required/>

        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}"></textarea>

        <label for="price">Price</label>
        <input id="price" type="number" step="0.01" min="0" th:field="*{price}" required/>

        <div class="checkbox-row">
            <input id="veg" type="checkbox" th:field="*{veg}"/>
            <label for="veg">Veg</label>
        </div>

        <label for="size">Size</label>
        <input id="size" type="text" th:field="*{size}" placeholder="e.g., Small, Medium, Large"/>

        <div class="checkbox-row">
            <input id="available" type="checkbox" th:field="*{available}"/>
            <label for="available">Available</label>
        </div>

        <div class="buttons">
            <button type="submit">Save</button>
            <a href="/admin/menu">Cancel</a>
        </div>
    </form>
</div>

<footer>
    &copy; 2025 Pizza Store - Admin Panel
</footer>
</body>
</html>
