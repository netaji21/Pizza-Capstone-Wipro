<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Home - Pizza Store</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fafafa; margin: 0; padding: 0; }
        header { background-color: #d32f2f; color: #ffffff; padding: 15px 20px; }
        header h1 { margin: 0; font-size: 22px; }
        nav a { color: #ffffff; margin-right: 15px; text-decoration: none; font-size: 14px; }
        .container { max-width: 800px; margin: 20px auto; background-color: #ffffff; padding: 20px; box-shadow: 0 0 8px rgba(0, 0, 0, 0.1); }
        h2 { margin-top: 0; }
        .info p { margin: 4px 0; }
        .revenue-card { 
            background-color: #e8f5e9; 
            border: 1px solid #c8e6c9; 
            padding: 15px; 
            margin-top: 20px; 
            border-radius: 8px; 
            text-align: center;
        }
        .revenue-amount { font-size: 24px; font-weight: bold; color: #2e7d32; }
        .links { margin-top: 20px; }
        .links a { display: inline-block; margin-right: 10px; margin-bottom: 10px; padding: 8px 12px; background-color: #1976d2; color: #ffffff; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .links a:hover { background-color: #0d47a1; }
        footer { margin-top: 20px; padding: 10px 20px; text-align: center; font-size: 12px; color: #777777; }
    </style>
</head>
<body>
<header>
    <h1>Pizza Store - Admin Panel</h1>
    <nav>
        <a href="/admin/home">Home</a>
        <a href="/admin/menu">Menu Management</a>
        <a href="/admin/orders">Orders</a>
        <a href="/admin/logout">Logout</a>
    </nav>
</header>

<div class="container">
    <h2>Welcome, <span th:text="${admin.name}">Admin</span></h2>

    <div class="info">
        <p>Email: <span th:text="${admin.email}">admin@example.com</span></p>
        <p>Phone: <span th:text="${admin.phone}">1234567890</span></p>
    </div>

    <div class="revenue-card">
        <h3>Total Revenue (Completed Orders)</h3>
        <div class="revenue-amount">₹<span th:text="${revenue}">0.00</span></div>
    </div>

    <div class="links">
        <a href="/admin/menu">Manage Menu Items</a>
        <a href="/admin/orders">View Orders &amp; Bills</a>
    </div>
</div>

<footer>
    &copy; 2025 Pizza Store - Admin Panel
</footer>
</body>
</html>
