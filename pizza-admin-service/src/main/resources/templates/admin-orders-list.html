<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Orders</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #d32f2f;
            color: #ffffff;
            padding: 15px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        nav a {
            color: #ffffff;
            margin-right: 15px;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #dddddd;
            padding: 8px;
            font-size: 14px;
            text-align: left;
        }

        th {
            background-color: #f5f5f5;
        }

        .status {
            font-weight: bold;
        }

        .status-COMPLETED {
            color: #2e7d32;
        }

        .status-CANCELLED {
            color: #d32f2f;
        }

        .status-NEW {
            color: #1976d2;
        }

        .actions a {
            text-decoration: none;
            color: #1976d2;
            font-size: 13px;
        }

        footer {
            margin-top: 20px;
            padding: 10px 20px;
            text-align: center;
            font-size: 12px;
            color: #777777;
        }
    </style>
</head>
<body>
<header>
    <h1>Pizza Store - Admin Panel</h1>
    <nav>
        <a href="/admin/home" th:href="@{/admin/home}">Home</a>
        <a href="/admin/menu" th:href="@{/admin/menu}">Menu Management</a>
        <a href="/admin/orders" th:href="@{/admin/orders}">Orders</a>
        <a href="/admin/logout" th:href="@{/admin/logout}">Logout</a>
    </nav>
</header>

<div class="container">
    <h2>All Orders</h2>

    <table>
        <thead>
        <tr>
            <th>Id</th>
            <th>Order Number</th>
            <th>Customer Id</th>
            <th>Status</th>
            <th>Order Time</th>
            <th>Delivery Mode</th>
            <th>Total Amount</th>
            <th>Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}">1</td>
            <td th:text="${order.orderNumber}">ORD-001</td>
            <td th:text="${order.customerId}">1001</td>
            <td>
                <span class="status"
                      th:text="${order.status}"
                      th:classappend="' status-' + ${order.status}">
                    NEW
                </span>
            </td>
            <td th:text="${order.orderTime}">2025-01-01T10:00</td>
            <td th:text="${order.deliveryMode}">DELIVERY</td>
            <td th:text="${order.totalAmount}">0.00</td>
            <td class="actions">
                <a th:href="@{'/admin/orders/' + ${order.id}}">View</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(orders)}">
            <td colspan="8">No orders found.</td>
        </tr>
        </tbody>
    </table>
</div>

<footer>
    &copy; 2025 Pizza Store - Admin Panel
</footer>
</body>
</html>
