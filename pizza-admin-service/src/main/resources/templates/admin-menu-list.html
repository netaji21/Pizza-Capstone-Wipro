<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Menu Management</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fafafa; margin: 0; padding: 0; }
        header { background-color: #d32f2f; color: #ffffff; padding: 15px 20px; }
        header h1 { margin: 0; font-size: 22px; }
        nav a { color: #ffffff; margin-right: 15px; text-decoration: none; font-size: 14px; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 1000px; margin: 20px auto; background-color: #ffffff; padding: 20px; box-shadow: 0 0 8px rgba(0, 0, 0, 0.1); }
        h2 { margin-top: 0; }
        .actions { margin-bottom: 15px; }
        .actions a { display: inline-block; padding: 8px 12px; background-color: #1976d2; color: #ffffff; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .actions a:hover { background-color: #0d47a1; }
        form.search-form { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        form.search-form input[type="text"] { padding: 6px; font-size: 14px; }
        form.search-form button { padding: 6px 12px; font-size: 14px; border: none; background-color: #388e3c; color: #ffffff; border-radius: 4px; cursor: pointer; }
        form.search-form button:hover { background-color: #2e7d32; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #dddddd; padding: 8px; font-size: 14px; text-align: left; }
        th { background-color: #f5f5f5; }
        .badge-yes { color: #2e7d32; font-weight: bold; }
        .badge-no { color: #d32f2f; font-weight: bold; }
        .table-actions a { margin-right: 8px; font-size: 13px; text-decoration: none; color: #1976d2; }
        footer { margin-top: 20px; padding: 10px 20px; text-align: center; font-size: 12px; color: #777777; }
    </style>
</head>
<body>
<header>
    <h1>Pizza Store - Admin Panel</h1>
    <nav>
        <a href="/admin/home">Home</a>
        <a href="/admin/menu">Menu Management</a>
        <a href="/admin/orders">Orders</a>
        <a href="/admin/logout">Logout</a>
    </nav>
</header>

<div class="container">
    <h2>Menu Items</h2>

    <div class="actions">
        <a href="/admin/menu/new">+ Add New Menu Item</a>
    </div>

    <form class="search-form" method="get" action="/admin/menu">
        <div>
            <label for="keyword">Search by Name: </label>
            <input type="text" id="keyword" name="keyword" th:value="${keyword}">
        </div>

        <div>
            <button type="submit">Search</button>
        </div>
    </form>

    <table>
        <thead>
        <tr>
            <th>Id</th>
            <th>Category</th>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Veg</th>
            <th>Size</th>
            <th>Available</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.category != null ? item.category.name : '-'}">Pizza</td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.description}"></td>
            <td th:text="${item.price}"></td>
            <td>
                <span th:if="${item.veg}" class="badge-yes">Yes</span>
                <span th:if="${!item.veg}" class="badge-no">No</span>
            </td>
            <td th:text="${item.size}"></td>
            <td>
                <span th:if="${item.available}" class="badge-yes">Yes</span>
                <span th:if="${!item.available}" class="badge-no">No</span>
            </td>
            <td class="table-actions">
                <a th:href="@{'/admin/menu/edit/' + ${item.id}}">Edit</a>
                <a th:href="@{'/admin/menu/delete/' + ${item.id}}"
                   onclick="return confirm('Are you sure you want to delete this item?');">
                    Delete
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="9">No menu items found.</td>
        </tr>
        </tbody>
    </table>
</div>

<footer>
    &copy; 2025 Pizza Store - Admin Panel
</footer>
</body>
</html>
