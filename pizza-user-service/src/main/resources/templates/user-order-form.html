<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Place Order</title>
    <style>
        body { font-family: Arial, sans-serif; background-color:#fafafa; margin:0; padding:0; }
        header { background-color:#1976d2; color:#ffffff; padding:15px 20px; }
        header h1 { margin:0; font-size:22px; }
        nav a { color:#ffffff; margin-right:15px; text-decoration:none; font-size:14px; }
        .container {
            max-width:600px; margin:20px auto; background-color:#ffffff;
            padding:20px; box-shadow:0 0 8px rgba(0,0,0,0.1);
        }
        h2 { margin-top:0; }
        .menu-info p { margin:4px 0; }
        label { display:block; margin-top:10px; font-weight:bold; }
        input[type="number"], select {
            width:100%; padding:8px; margin-top:4px; box-sizing:border-box;
        }
        .buttons { margin-top:15px; }
        .buttons button, .buttons a {
            display:inline-block; padding:8px 14px; border-radius:4px;
            border:none; text-decoration:none; font-size:14px; cursor:pointer;
        }
        .buttons button { background-color:#388e3c; color:#ffffff; }
        .buttons button:hover { background-color:#2e7d32; }
        .buttons a { background-color:#9e9e9e; color:#ffffff; }
        .buttons a:hover { background-color:#616161; }
        footer { margin-top:20px; padding:10px 20px; text-align:center; font-size:12px; color:#777777; }
    </style>
</head>
<body>
<header>
    <h1>Pizza Store - Place Order</h1>
    <nav>
        <a href="/customers/home">Home</a>
        <a href="/customers/menu">Menu</a>
        <a href="/customers/orders">My Orders</a>
        <a href="/customers/logout">Logout</a>
    </nav>
</header>

<div class="container">
    <h2>Order Details</h2>

    <div class="menu-info">
        <p><strong>Item:</strong> <span th:text="${menuItem.name}">Pizza Name</span></p>
        <p><strong>Description:</strong> <span th:text="${menuItem.description}">Desc</span></p>
        <p><strong>Price:</strong> ₹<span th:text="${menuItem.price}">0.00</span></p>
        <p th:if="${customerEmail != null}">
            <strong>Ordering as:</strong> <span th:text="${customerEmail}">you@example.com</span>
        </p>
    </div>

    <form method="post" action="/customers/order">
        <input type="hidden" name="itemId" th:value="${menuItem.id}"/>

        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" name="quantity" min="1" value="1" required/>

        <label for="deliveryMode">Delivery Mode</label>
        <select id="deliveryMode" name="deliveryMode" required>
            <option value="DELIVERY">Delivery</option>
            <option value="TAKEAWAY">Takeaway</option>
        </select>

        <label for="paymentMode">Payment Mode</label>
        <select id="paymentMode" name="paymentMode" required>
            <option value="CASH">Cash</option>
            <option value="CARD">Card</option>
        </select>

        <div class="buttons">
            <button type="submit">Place Order</button>
            <a href="/customers/menu">Cancel</a>
        </div>
    </form>
</div>

<footer>
    &copy; 2025 Pizza Store
</footer>
</body>
</html>
