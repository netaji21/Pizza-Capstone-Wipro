<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <!-- Background -->
  <rect width="920" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Pizza App — Microservices Architecture</text>

  <!-- Browser / Client -->
  <rect x="380" y="60" width="160" height="50" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="460" y="84" text-anchor="middle" font-weight="bold">Browser</text>
  <text x="460" y="100" text-anchor="middle" font-size="11" fill="#6b7280">User &amp; Admin portals</text>

  <!-- Discovery Server (Eureka) -->
  <rect x="40" y="160" width="180" height="60" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="130" y="185" text-anchor="middle" font-weight="bold">Discovery Server</text>
  <text x="130" y="203" text-anchor="middle" font-size="11" fill="#6b7280">Eureka · :8761</text>

  <!-- Config Server -->
  <rect x="700" y="160" width="180" height="60" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="790" y="185" text-anchor="middle" font-weight="bold">Config Server</text>
  <text x="790" y="203" text-anchor="middle" font-size="11" fill="#6b7280">Spring Cloud Config · :8888</text>

  <!-- User Service -->
  <rect x="40" y="280" width="200" height="90" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="140" y="305" text-anchor="middle" font-weight="bold">User Service · :8081</text>
  <text x="140" y="324" text-anchor="middle" font-size="11" fill="#374151">Register / login (JWT)</text>
  <text x="140" y="340" text-anchor="middle" font-size="11" fill="#374151">Menu browse · Cart</text>
  <text x="140" y="356" text-anchor="middle" font-size="11" fill="#374151">Place &amp; cancel orders</text>

  <!-- Admin Service -->
  <rect x="260" y="280" width="200" height="90" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="360" y="305" text-anchor="middle" font-weight="bold">Admin Service · :8082</text>
  <text x="360" y="324" text-anchor="middle" font-size="11" fill="#374151">Admin login (JWT)</text>
  <text x="360" y="340" text-anchor="middle" font-size="11" fill="#374151">Menu CRUD · Orders</text>
  <text x="360" y="356" text-anchor="middle" font-size="11" fill="#374151">Revenue tracking</text>

  <!-- Payment Service -->
  <rect x="480" y="280" width="200" height="90" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="580" y="305" text-anchor="middle" font-weight="bold">Payment Service · :8083</text>
  <text x="580" y="324" text-anchor="middle" font-size="11" fill="#374151">Dummy payment processor</text>
  <text x="580" y="340" text-anchor="middle" font-size="11" fill="#374151">Persists payment record</text>

  <!-- Notification Service -->
  <rect x="700" y="280" width="180" height="90" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="790" y="305" text-anchor="middle" font-weight="bold">Notification · :8084</text>
  <text x="790" y="324" text-anchor="middle" font-size="11" fill="#374151">Sends emails on</text>
  <text x="790" y="340" text-anchor="middle" font-size="11" fill="#374151">order events</text>
  <text x="790" y="356" text-anchor="middle" font-size="11" fill="#374151">via Gmail SMTP</text>

  <!-- Databases -->
  <ellipse cx="140" cy="450" rx="60" ry="20" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/>
  <text x="140" y="455" text-anchor="middle" font-size="11">H2: userdb</text>
  <ellipse cx="360" cy="450" rx="60" ry="20" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/>
  <text x="360" y="455" text-anchor="middle" font-size="11">H2: admindb</text>
  <ellipse cx="580" cy="450" rx="60" ry="20" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/>
  <text x="580" y="455" text-anchor="middle" font-size="11">H2: paymentdb</text>
  <ellipse cx="790" cy="450" rx="60" ry="20" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/>
  <text x="790" y="455" text-anchor="middle" font-size="11">H2: notificationdb</text>

  <!-- DB connections (dashed) -->
  <line x1="140" y1="370" x2="140" y2="430" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="360" y1="370" x2="360" y2="430" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="580" y1="370" x2="580" y2="430" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="790" y1="370" x2="790" y2="430" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Browser to user/admin -->
  <line x1="430" y1="110" x2="200" y2="278" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="490" y1="110" x2="380" y2="278" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- Admin -> Payment -->
  <line x1="460" y1="325" x2="478" y2="325" stroke="#374151" stroke-width="1.5"/>
  <polygon points="478,325 472,322 472,328" fill="#374151"/>
  <!-- Admin -> Notification -->
  <line x1="460" y1="345" x2="698" y2="345" stroke="#374151" stroke-width="1.5"/>
  <polygon points="698,345 692,342 692,348" fill="#374151"/>

  <!-- All services register with Eureka -->
  <line x1="130" y1="220" x2="140" y2="278" stroke="#b45309" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="130" y1="220" x2="280" y2="278" stroke="#b45309" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="220" y1="195" x2="500" y2="278" stroke="#b45309" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="220" y1="195" x2="720" y2="278" stroke="#b45309" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- All services fetch config from Config Server -->
  <line x1="790" y1="220" x2="700" y2="278" stroke="#b45309" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="790" y1="220" x2="500" y2="278" stroke="#b45309" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="700" y1="195" x2="430" y2="278" stroke="#b45309" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="700" y1="195" x2="220" y2="278" stroke="#b45309" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Legend -->
  <rect x="40" y="500" width="14" height="3" fill="#b45309"/>
  <text x="60" y="504" font-size="11">infra services (Eureka registration, config fetch)</text>
  <rect x="300" y="500" width="14" height="3" fill="#1d4ed8"/>
  <text x="320" y="504" font-size="11">HTTP from browser</text>
  <rect x="470" y="500" width="14" height="3" fill="#374151"/>
  <text x="490" y="504" font-size="11">REST between services</text>
  <line x1="640" y1="503" x2="664" y2="503" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="670" y="504" font-size="11">in-memory DB per service</text>
</svg>
